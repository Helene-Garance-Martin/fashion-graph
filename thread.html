<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THREAD — an inspiration atlas for The Costume Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root{
    --ground:#141419; --ground-2:#1c1c24; --ink:#e8e6e0; --ink-dim:#8a8792;
    --gold:#c9a24b; --marble:#d8cdb8; --line:#33323c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);
    font-family:"Cormorant Garamond",Georgia,serif;overflow:hidden}
  .label{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
    text-transform:uppercase;letter-spacing:.18em;font-size:10px;color:var(--ink-dim)}
  header{position:fixed;top:0;left:0;right:0;height:64px;z-index:20;
    display:flex;align-items:center;gap:24px;padding:0 24px;
    background:linear-gradient(180deg,rgba(20,20,25,.95),rgba(20,20,25,.6));
    border-bottom:1px solid var(--line)}
  .brand{font-size:26px;letter-spacing:.34em;font-weight:600;white-space:nowrap}
  .brand small{display:block;letter-spacing:.2em;font-size:9px;color:var(--ink-dim);
    text-transform:uppercase;font-family:-apple-system,sans-serif;margin-top:-2px}
  .search{flex:1;max-width:540px;position:relative}
  .search input{width:100%;background:var(--ground-2);border:1px solid var(--line);
    color:var(--ink);border-radius:22px;padding:10px 16px;font-size:16px;
    font-family:"Cormorant Garamond",serif;outline:none}
  .search input:focus{border-color:var(--gold)}
  .search .hint{position:absolute;right:16px;top:12px;pointer-events:none}
  #status{font-size:14px;color:var(--ink-dim);font-style:italic;white-space:nowrap}
  #stage{position:fixed;inset:64px 360px 0 0}
  svg{width:100%;height:100%;display:block;cursor:grab}
  .link{stroke:var(--line);stroke-width:1}
  .link.inspired{stroke:var(--gold);stroke-width:1.5}
  .link.example_of{stroke:#5a4a2a;stroke-width:1}
  .link.explore{stroke:var(--gold);stroke-dasharray:1 4;opacity:.8}
  .node circle{stroke:rgba(255,255,255,.14);stroke-width:1.5;cursor:pointer}
  .node text{font-size:13px;fill:var(--ink);pointer-events:none;
    paint-order:stroke;stroke:var(--ground);stroke-width:3px}
  .node.sourceworld text{font-size:15px;fill:var(--gold)}
  .dim{opacity:.1;transition:opacity .3s}
  .lit{opacity:1;transition:opacity .3s}
  aside{position:fixed;top:64px;right:0;bottom:0;width:360px;z-index:20;
    background:var(--ground-2);border-left:1px solid var(--line);
    display:flex;flex-direction:column}
  .walllabel{padding:22px 24px;border-bottom:1px solid var(--line);overflow-y:auto;max-height:56%}
  .walllabel .kind{color:var(--gold)}
  .walllabel h2{font-size:28px;font-weight:500;margin:8px 0 2px;line-height:1.06}
  .walllabel .origin{font-style:italic;color:var(--ink-dim);font-size:16px;margin-bottom:12px}
  .walllabel img{width:100%;border-radius:6px;margin:6px 0 12px;display:block;
    border:1px solid var(--line)}
  .walllabel p{font-size:16px;line-height:1.45;margin:0 0 14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chip{font-family:-apple-system,sans-serif;font-size:11px;letter-spacing:.04em;
    border:1px solid var(--line);border-radius:12px;padding:4px 10px;color:var(--ink);
    cursor:pointer;background:var(--ground)}
  .chip.gold{border-color:var(--gold);color:var(--gold)}
  .metlink{display:inline-block;font-family:-apple-system,sans-serif;font-size:12px;
    letter-spacing:.04em;color:var(--gold);text-decoration:none;margin-bottom:14px}
  .add{width:100%;background:var(--gold);color:#1a1508;border:none;border-radius:22px;
    padding:11px;font-family:-apple-system,sans-serif;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;cursor:pointer;font-weight:600}
  .add:disabled{background:var(--line);color:var(--ink-dim);cursor:default}
  .tray{flex:1;display:flex;flex-direction:column;padding:18px 24px;overflow:hidden}
  .exh-title{font-size:21px;font-weight:500;background:none;border:none;
    border-bottom:1px dashed var(--line);color:var(--ink);width:100%;
    font-family:"Cormorant Garamond",serif;padding:6px 0;margin:6px 0 12px;outline:none}
  .exh-title:focus{border-color:var(--gold)}
  .tray ul{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
  .tray li{display:flex;align-items:center;gap:10px;padding:7px 0;
    border-bottom:1px solid var(--line);font-size:15px}
  .tray li .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .tray li .rm{margin-left:auto;color:var(--ink-dim);cursor:pointer;font-size:13px}
  .tray .empty{color:var(--ink-dim);font-style:italic;font-size:15px;margin-top:8px}
  .count{margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="brand">THREAD<small>an inspiration atlas · live from the collection</small></div>
  <div class="search">
    <input id="q" placeholder="Seed a house (“Balenciaga”) · a source (“kimono”) · or explore The Met…" autocomplete="off">
    <span class="hint label">↵</span>
  </div>
  <div id="status">connecting…</div>
</header>

<div id="stage"><svg></svg></div>

<aside>
  <div class="walllabel" id="wall">
    <div class="kind label">—</div>
    <h2>—</h2>
    <div class="origin"></div>
    <div class="imgwrap"></div>
    <p></p>
    <div class="label" style="margin-bottom:6px">inspired by</div>
    <div class="chips"></div>
    <a class="metlink" target="_blank" style="display:none"></a>
    <button class="add">Add to exhibition</button>
  </div>
  <div class="tray">
    <div class="label" style="font-size:10px">the exhibition</div>
    <input class="exh-title" id="exhTitle" value="A new show, taking shape">
    <ul id="trayList"></ul>
    <div class="count label"></div>
  </div>
</aside>

<script>
const API = ""; // same origin — served by FastAPI

// editorial copy the graph doesn't hold (structure is live; voice is curated)
const DESC = {
  "McCardell":{o:"American · 1905–1958",b:"Mother of American sportswear. Stripped couture of fuss — the popover, separates, denim, function as elegance."},
  "Vionnet":{o:"French · 1876–1975",b:"Queen of the bias cut. Draped cloth on the living body — the Parthenon made wearable."},
  "Grès":{o:"French · 1903–1993",b:"Sculptor in silk jersey. Pleated goddess-gowns worked directly on the form."},
  "Balenciaga":{o:"Spanish · 1895–1972",b:"“The master of us all.” Sombre, sculptural volumes from Spanish art and dress."},
  "Chanel":{o:"French · 1883–1971",b:"Modernism in cloth — menswear, jersey, the total wardrobe of the working woman."},
  "Lanvin":{o:"French · 1867–1946",b:"The robe de style and a famous blue drawn from medieval and early-Renaissance art."},
  "Schiaparelli":{o:"Italian · 1890–1973",b:"Surrealism worn — the lobster dress, the shoe hat, Dalí and Cocteau."},
  "Charles James":{o:"American · 1906–1978",b:"Dressmaking as architecture and mathematics — the Clover Leaf, the Swan."},
  "Ancient Greek sculpture":{o:"Greek & Roman Art · The Met",b:"Draped marble — korai, Nikai, grave stelai. The source of classical drapery."},
  "Japanese kimono":{o:"Asian Art · The Met",b:"Flat, geometric construction that works with the uncut rectangle of cloth."},
  "Spanish painting":{o:"European Paintings · The Met",b:"El Greco, Velázquez, Goya — the infantas’ volumes, ecclesiastical black."},
};

// ---------- graph state ----------
const svg = d3.select("svg"), root = svg.append("g");
let W = innerWidth-360, H = innerHeight-64;
svg.call(d3.zoom().scaleExtent([.3,2.5]).on("zoom",e=>root.attr("transform",e.transform)));
const byId = new Map();        // id -> node
const linkKey = new Set();     // "a|b|kind"
let nodes = [], links = [], houses = [], selected = null;

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d=>d.id).distance(l=>l.kind==="created"?45:l.kind==="example_of"?60:150).strength(.5))
  .force("charge", d3.forceManyBody().strength(-380))
  .force("center", d3.forceCenter(W/2,H/2))
  .force("collide", d3.forceCollide(26));

let linkSel = root.append("g").selectAll("line");
let nodeSel = root.append("g").selectAll("g");

function radius(d){ return d.type==="sourceworld"?20 : d.type==="designer"?15 : d.type==="artwork"?9 : 7; }

function mergeGraph(g){
  (g.nodes||[]).forEach(n=>{ if(!byId.has(n.id)){ byId.set(n.id,n); nodes.push(n); } });
  (g.links||[]).forEach(l=>{
    const k = l.source+"|"+l.target+"|"+l.kind;
    if(!linkKey.has(k)){ linkKey.add(k); links.push({...l}); }
  });
  // colour garments by the house that created them, for coherent constellations
  links.forEach(l=>{
    if(l.kind==="created"){
      const d = byId.get(typeof l.source==="object"?l.source.id:l.source);
      const g2 = byId.get(typeof l.target==="object"?l.target.id:l.target);
      if(d&&g2&&d.color) g2.color = d.color;
    }
  });
  draw();
}

function draw(){
  linkSel = linkSel.data(links, d=>(d.source.id||d.source)+"|"+(d.target.id||d.target)+"|"+d.kind);
  linkSel.exit().remove();
  linkSel = linkSel.enter().append("line").attr("class",d=>"link "+d.kind).merge(linkSel);

  nodeSel = nodeSel.data(nodes, d=>d.id);
  nodeSel.exit().remove();
  const g = nodeSel.enter().append("g").attr("class",d=>"node "+d.type)
    .call(d3.drag()
      .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
      .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}))
    .on("click",(e,d)=>{ onNodeClick(d); e.stopPropagation(); });
  g.append("circle").attr("r",radius).attr("fill",d=>d.color||"#8a8792");
  g.append("text").attr("x",d=>radius(d)+6).attr("dy",".35em")
    .text(d=>["designer","sourceworld"].includes(d.type)?d.label:"");
  nodeSel = g.merge(nodeSel);
  nodeSel.select("circle").attr("fill",d=>d.color||"#8a8792"); // refresh garment colours

  sim.nodes(nodes); sim.force("link").links(links); sim.alpha(.7).restart();
}

sim.on("tick",()=>{
  linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
         .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
});

// ---------- fetching the real graph ----------
async function api(path){
  const r = await fetch(API+path);
  if(!r.ok) throw new Error(path+" → "+r.status);
  return r.json();
}
async function expandHouse(name){ setStatus("loading "+name+"…"); mergeGraph(await api("/house/"+encodeURIComponent(name))); setStatus(""); }
async function expandSource(name){ setStatus("loading "+name+"…"); mergeGraph(await api("/source/"+encodeURIComponent(name))); setStatus(""); }
function setStatus(t){ document.getElementById("status").textContent = t; }

// ---------- click: select + expand ----------
function onNodeClick(d){
  select(d.id);
  if(d.type==="designer") expandHouse(d.label).then(()=>select(d.id));
  else if(d.type==="sourceworld") expandSource(d.label).then(()=>select(d.id));
}
function neighbours(id){
  const near = new Set([id]);
  links.forEach(l=>{const s=l.source.id||l.source,t=l.target.id||l.target;
    if(s===id)near.add(t); if(t===id)near.add(s);});
  return near;
}
function select(id){
  selected = id;
  const near = neighbours(id);
  nodeSel.classed("dim",d=>!near.has(d.id)).classed("lit",d=>near.has(d.id));
  linkSel.classed("dim",d=>{const s=d.source.id||d.source,t=d.target.id||d.target;return !(near.has(s)&&near.has(t));});
  wallLabel(byId.get(id));
}
svg.on("click",()=>{selected=null;nodeSel.classed("dim",false).classed("lit",false);linkSel.classed("dim",false);});

// ---------- wall label ----------
const wall = document.getElementById("wall");
function wallLabel(d){
  if(!d) return;
  const desc = DESC[d.label] || {};
  const inspiredBy = links.filter(l=>(l.target.id||l.target)===d.id && l.kind==="inspired")
                          .map(l=>byId.get(l.source.id||l.source)).filter(Boolean);
  wall.querySelector(".kind").textContent = d.type==="sourceworld"?"source-world":d.type;
  wall.querySelector("h2").textContent = d.label;
  wall.querySelector(".origin").textContent = desc.o || d.culture || d.date || "";
  wall.querySelector(".imgwrap").innerHTML = d.image ? `<img src="${d.image}" alt="">` : "";
  wall.querySelector("p").textContent = desc.b ||
    (d.type==="garment" ? "20th-century couture — rights-reserved, so we link to the Met rather than embed."
     : d.type==="artwork" ? "Open-access from the Met — a candidate thread of inspiration."
     : "A node in the atlas.");
  const chips = wall.querySelector(".chips");
  chips.innerHTML = inspiredBy.length
    ? inspiredBy.map(s=>`<span class="chip gold" data-go="${s.id}">${s.label}</span>`).join("")
    : `<span class="chip" style="color:var(--ink-dim)">— a source, or a starting point —</span>`;
  chips.querySelectorAll("[data-go]").forEach(c=>c.onclick=()=>select(c.dataset.go));
  const ml = wall.querySelector(".metlink");
  if(d.url){ ml.style.display="inline-block"; ml.href=d.url; ml.textContent="View at The Met ↗"; }
  else ml.style.display="none";
  const add = wall.querySelector(".add");
  add.disabled = tray.includes(d.id);
  add.textContent = tray.includes(d.id) ? "In the exhibition ✓" : "Add to exhibition";
  add.onclick = ()=>addToTray(d.id);
}

// ---------- exhibition tray ----------
let tray = [];
const trayList = document.getElementById("trayList");
function addToTray(id){ if(!tray.includes(id)){tray.push(id);renderTray();if(selected===id)wallLabel(byId.get(id));} }
function removeFromTray(id){ tray=tray.filter(x=>x!==id);renderTray();if(selected)wallLabel(byId.get(selected)); }
function renderTray(){
  const list = tray.map(id=>byId.get(id)).filter(Boolean);
  trayList.innerHTML = list.length
    ? list.map(n=>`<li><span class="dot" style="background:${n.color||'#c9a24b'}"></span>${n.label}<span class="rm" data-rm="${n.id}">remove</span></li>`).join("")
    : `<li class="empty">Click a garment, a marble, a house — anything that could hang on the wall — and add it here. The tray is your show.</li>`;
  trayList.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>removeFromTray(b.dataset.rm));
  document.querySelector(".count").textContent = list.length ? `${list.length} object${list.length>1?"s":""} — your exhibition takes shape` : "";
}

// ---------- the search: seed a house, a source, or explore The Met ----------
const MET = {
  workwear:[["Work apron, 19th c."],["Chore jacket"],["Sailor’s dungarees"]],
  denim:[["Riveted work trousers"],["Sailor’s dungarees"]],
  utility:[["Utility coverall"],["Feed-sack dress"]],
};
document.getElementById("q").addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  const term = e.target.value.trim(); if(!term) return;
  const house = houses.find(h=>h.label.toLowerCase()===term.toLowerCase());
  const src = Object.keys(DESC).find(k=>DESC[k] && k.toLowerCase().includes(term.toLowerCase()) && !houses.some(h=>h.label===k));
  if(house){ expandHouse(house.label).then(()=>select(house.id)); }
  else if(src){ expandSource(src).then(()=>select("sourceworld:"+src)); }
  else exploreMet(term);
  e.target.value="";
});
function exploreMet(term){
  const key = Object.keys(MET).find(k=>term.toLowerCase().includes(k));
  const results = key?MET[key]:[[`“${term}” — textile study`],[`“${term}” — object`]];
  const anchorId = selected && byId.get(selected)?.type==="designer" ? selected : "designer:McCardell";
  const a = byId.get(anchorId);
  results.forEach(r=>{
    const id="met:"+Math.random().toString(36).slice(2,7);
    const n={id,label:r[0],type:"met",color:"#d8cdb8",
      x:(a?a.x:W/2)+(Math.random()*80-40),y:(a?a.y:H/2)+(Math.random()*80-40)};
    byId.set(id,n); nodes.push(n);
    const k=id+"|"+anchorId+"|explore"; linkKey.add(k);
    links.push({source:id,target:anchorId,kind:"explore"});
  });
  draw(); setTimeout(()=>select(anchorId),350);
}

// ---------- boot ----------
(async function(){
  try{
    const h = await api("/health");
    if(!h.neo4j_configured){ setStatus("Neo4j not connected"); }
    houses = await api("/houses");
    setStatus(houses.length+" houses");
    await expandHouse("McCardell");   // seed the curator's session
    select("designer:McCardell");
  }catch(err){
    setStatus("can’t reach the API — is uvicorn running?");
    console.error(err);
  }
})();
addEventListener("resize",()=>{W=innerWidth-360;H=innerHeight-64;
  sim.force("center",d3.forceCenter(W/2,H/2)).alpha(.3).restart();});
</script>
</body>
</html>
